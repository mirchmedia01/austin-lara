services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: "${APP_URL:-https://austinoptics.com}"
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: resend
      MAIL_FROM_ADDRESS: "noreply@mail.sprintmediadesign.com"
      MAIL_FROM_NAME: "Austin Optics"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      ADMIN_EMAILS: "abdullah.saeed1724@gmail.com,marketing@mirchmedia.com,austinoptics@gmail.com"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
